[project]
name = "Berrizdown"
version = "0.2.9"
description = "Image Video Post Comment Berriz download tool "
readme = "README.md"
requires-python = "==3.12.*"
license = "AGPL-3.0-or-later"
authors = [{ name = "omenbibi", email = "ytiq8nxnm@mozmail.com" }]
dependencies = [
    "aiodns>=3.5,<4",
    "aiofiles>=24.1,<25",
    "aiolimiter>=1.0.0,<2",
    "aiohttp>=3.12,<4",
    "aioshutil>=1.5,<2",
    "async-lru",
    "bs4>=0.0.2,<1",
    "certifi>=2025.8,<2027",
    "chardet==7.7.0",
    "click>=8.3,<9",
    "cryptography~=45.0.6",
    "cssutils==2.15.0",
    "dotenv>=0.9.9,<1",
    "ECPy~=1.2.5",
    "email_validator>=2.3,<3",
    "encutils==1.0.0",
    "fake-useragent>=2.2,<3",
    "ffmpeg-python>=0.2,<1",
    "httpagentparser>=1.9.5,<2",
    "httpx[http2]>=0.28,<1",
    "InquirerPy>=0.3,<1",
    "inputimeout>=1.0.4,<2",
    "lxml>=6.0,<7",
    "m3u8>=6.0.0",
    "more-itertools==11.2.1",
    "orjson>=3.11,<4",
    "pip-system-certs>=5.2,<6",
    "platformdirs~=4.4.0",
    "protobuf>=3.6.1,<7",
    "pycryptodome>=3.23,<4",
    "pydantic",
    "PyJWT>=2.10,<3",
    "pymp4>=1.4.0,<2",
    "pysubs2",
    "python-dateutil>=2.9,<3",
    "pytz>=2025.2,<2027",
    "PyYAML~=6.0.3",
    "requests>=2.32,<3",
    "rich>=14.1,<15",
    "ruamel.yaml>=0.18,<1",
    "tzdata>=2025.2,<2027",
    "Unidecode",
    "urllib3>=2.5,<3",
    "validators>=0.35,<1",
]

[project.scripts]
berrizdown = "berrizdown.__main__:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["logs", "tests", "docs"]

[tool.ruff]
line-length = 221
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
exclude = ["readydl_pyplayready", "wvd", "pywidevine", "pyplayready"]

[tool.ruff.format]
quote-style = "double"
